name: Deploy LeadCollector to cPanel

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Check out code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (for React/Vite frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Build Frontend (Vite -> public/dist)
        run: |
          cd frontend
          npm ci
          npm run build:cpanel
          cd ..

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo, pdo_mysql, curl

      - name: 🎼 Install PHP Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      # =========================================================================
      # DEPLOYMENT OPTION 1: FTP / FTPS (Recommended for most shared cPanel hosts)
      # =========================================================================
      - name: 🚀 Deploy via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_SERVER_DIR || 'public_html/' }}
          protocol: ftps # Change to 'ftp' if FTPS is not enabled on your host
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            frontend/**
            tests/**
            .env
            .env.*
            !.env.example
            storage/logs/*
            storage/sessions/*
            public/uploads/*
            README.md
            report.md
            DB.md
            .playwright-cli/**

      # =========================================================================
      # DEPLOYMENT OPTION 2: SSH / Rsync (Alternative if you have cPanel SSH access)
      # To use SSH instead of FTP: Uncomment this step and comment out the FTP step above
      # =========================================================================
      # - name: 🚀 Deploy via SSH & Rsync
      #   uses: easingthemes/ssh-deploy@main
      #   with:
      #     SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
      #     REMOTE_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      #     REMOTE_USER: ${{ secrets.CPANEL_SSH_USER }}
      #     REMOTE_PORT: ${{ secrets.CPANEL_SSH_PORT || 22 }}
      #     TARGET: ${{ secrets.CPANEL_TARGET_PATH || '/home/youruser/public_html/' }}
      #     EXCLUDE: "/.git/, /.github/, /frontend/, /node_modules/, /tests/, /.env, /storage/logs/*, /storage/sessions/*, /public/uploads/*"
